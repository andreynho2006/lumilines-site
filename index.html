<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Lumilines</title>
<meta name="description" content="A calm daily logic puzzle: connect the dots with lines of light.">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --rose: #FF4F8B; --amber: #FFC23D; --text: #EDEDED; --muted: #A6A6A6; }
  * { box-sizing: border-box; }
  html { background: #000; }
  body {
    margin: 0; background: #000; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px; line-height: 1.6; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px 24px; }
  h1 { font-size: 2.2rem; line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.02em; }
  h2 { font-size: 1.15rem; margin: 32px 0 6px; color: var(--amber); }
  p, li { color: var(--text); }
  .muted { color: var(--muted); }
  a { color: var(--rose); text-decoration: none; }
  a:hover, a:focus { text-decoration: underline; }
  .back { display: inline-block; margin-bottom: 28px; font-weight: 600; }
  ul { padding-left: 1.2em; }
  li { margin: 6px 0; }
  footer { max-width: 680px; margin: 0 auto; padding: 32px 20px 48px; border-top: 1px solid #222;
           display: flex; gap: 20px; flex-wrap: wrap; font-size: 15px; }
  footer .muted { margin-left: auto; }
</style>
</head>
<body>
<main>

<style>
  .hero { text-align: center; padding-top: 24px; }
  .icon { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 0 48px rgba(255,79,139,0.35); }
  .tagline { font-size: 1.25rem; color: var(--muted); max-width: 30ch; margin: 0 auto 40px; }
  .points { list-style: none; padding: 0; margin: 0 auto 40px; max-width: 420px; text-align: left; }
  .points li { display: flex; align-items: center; gap: 14px; padding: 14px 18px; margin: 10px 0;
               background: #0F0F0F; border: 1px solid #1F1F1F; border-radius: 16px; font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .badge { display: inline-block; padding: 14px 24px; border-radius: 14px; border: 1px solid var(--amber);
           color: var(--amber); font-weight: 600; }
</style>
<div class="hero">
  <img class="icon" src="icon.png" alt="Lumilines app icon" width="128" height="128">
  <h1 style="margin-top:20px">Lumilines</h1>
  <p class="tagline">A calm daily logic puzzle: connect the dots with lines of light.</p>
  <ul class="points">
    <li><span class="dot" style="background:var(--rose);box-shadow:0 0 10px var(--rose)"></span>Three new puzzles every day</li>
    <li><span class="dot" style="background:var(--amber);box-shadow:0 0 10px var(--amber)"></span>Calm, offline, no account</li>
    <li><span class="dot" style="background:#3FE0FF;box-shadow:0 0 10px #3FE0FF"></span>Color-blind friendly</li>
  </ul>
  <!-- App Store badge goes here once the app is live. -->
  <p><span class="badge">Coming soon to the App Store</span></p>
</div>
</main>
<footer>
  <a href="index.html">Home</a>
  <a href="support.html">Support</a>
  <a href="privacy.html">Privacy</a>
  <span class="muted">© 2026 Lumilines</span>
</footer>
</body>
</html>
